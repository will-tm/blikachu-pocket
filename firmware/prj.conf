#
# blikachu-pocket configuration
# Target: Bouffalo Lab BL618
#

# Serial / Console (over USB CDC ACM)
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y

# USB device stack — using the new device_next stack (USBD).
# Composite: CDC ACM (console + shell) and MSC (NAND flash-disk).
CONFIG_USB_DEVICE_STACK=n
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_USBD_MSC_CLASS=y

CONFIG_USBD_LOG_LEVEL_WRN=y
# Disable noisy controller logging.
CONFIG_UDC_DRIVER_LOG_LEVEL_OFF=y

# Flash + disk-on-flash backend
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVER_FLASH=y

# Filesystem: FatFs with FAT16 + long filenames
CONFIG_FILE_SYSTEM=y
CONFIG_FS_LOG_LEVEL_WRN=y
CONFIG_FILE_SYSTEM_SHELL=y
CONFIG_FILE_SYSTEM_MKFS=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_LFN=y
CONFIG_FS_FATFS_LFN_MODE_STACK=y
CONFIG_FS_FATFS_MAX_LFN=255
CONFIG_FS_FATFS_MKFS=y
# f_expand() for storage_defrag_file() — contiguous preallocation so
# fragmented ROMs can be rewritten XIP-runnable.
CONFIG_FS_FATFS_EXTRA_NATIVE_API=y

# Logging
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_BUFFER_SIZE=16384
CONFIG_LOG_PROCESS_THREAD_CUSTOM_PRIORITY=y
CONFIG_LOG_PROCESS_THREAD_PRIORITY=2
# Wi-Fi connection diagnostics require more stack than the default 768 B.
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=4096
CONFIG_LOG_PROCESS_TRIGGER_THRESHOLD=1
CONFIG_LOG_PROCESS_THREAD_SLEEP_MS=100

# GPIO / SPI / PWM
CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_DMA=y
CONFIG_PWM=y
CONFIG_REGULATOR=y
CONFIG_REGULATOR_FIXED=y

# I2C bus and LSM6DSV16X IMU diagnostics.
CONFIG_I2C=y
CONFIG_I2C_SHELL=y
CONFIG_SENSOR=y
CONFIG_LSM6DSV16X=y

# Display: ST7789V via MIPI DBI (SPI)
CONFIG_DISPLAY=y
CONFIG_MIPI_DBI=y
CONFIG_MIPI_DBI_SPI=y
CONFIG_ST7789V=y
# Device PM so `sleep` can send the panel SLPIN (Sleep In) — DISPOFF
# alone leaves the booster/oscillator running (~mA vs tens of µA).
CONFIG_PM_DEVICE=y

# Input: gpio-keys polling, mapped to GB joypad in emu.c
CONFIG_INPUT=y
CONFIG_INPUT_GPIO_KEYS=y
# The input dispatcher thread defaults to K_LOWEST_APPLICATION_THREAD_PRIO,
# which the always-busy emu worker (prio 10) starves completely — the
# 16-entry event queue fills and button presses are dropped ("Event
# dropped, queue full" warnings). Keep it above the emu/render threads.
CONFIG_INPUT_THREAD_PRIORITY_OVERRIDE=y
CONFIG_INPUT_THREAD_PRIORITY=7

# Battery monitor: VBAT_MES (VBAT/2) on GPIO10/ADC7, logged every 30 s.
CONFIG_ADC=y

# Shell
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
# Raw register reads (`devmem`) — non-invasive hardware state checks
# (e.g. verifying the GPIO26 power-hold pad without reconfiguring it).
CONFIG_DEVMEM_SHELL=y
CONFIG_SHELL_PROMPT_UART="blikachu$ "
# Don't double-emit log lines through both the UART backend and the
# shell's own log forwarder — the duplicates flood CDC TX at 60 fps.
CONFIG_SHELL_LOG_BACKEND=n
# fs ls/cat/etc walk FATFS-on-exFAT which has a deep stack footprint;
# the 2048-byte default will silently overrun and lock the shell thread.
CONFIG_SHELL_STACK_SIZE=8192

# The system workqueue runs work items that reach FATFS (debounced
# settings persist, deep-sleep entry with unmount) and gfx redraws (HUD
# expiry -> menu_refresh). The 1024-byte default overflowed in f_stat —
# caught by the PSPLIM guard as a clean 'stack overflow in sysworkq'
# fault record. Same sizing rationale as the shell stack.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=8192

# 10 us system tick — emu_loop's k_timer paces frames at 16743 us (the
# real DMG period). At the default 100 us tick the period rounds and we
# cap at ~59.88 fps; with 10 us ticks we land within ~0.06% of 59.7275
# fps. Cost is 10x more tick interrupts, negligible at 312 MHz.
CONFIG_SYS_CLOCK_TICKS_PER_SEC=100000

# UDC buffer pool — composite CDC ACM + MSC needs headroom beyond the
# 1024-byte default; exhaustion hits __ASSERT in the net_buf alloc path.
CONFIG_UDC_BUF_POOL_SIZE=8192
CONFIG_UDC_BUF_COUNT=24

# Memory
CONFIG_HEAP_MEM_POOL_SIZE=32768
CONFIG_MAIN_STACK_SIZE=8192

# Build with -O2 + further hot-path overrides in CMakeLists.txt for the
# emulator core. Plenty of flash room and we burn most cycles inside
# gb_run_frame, so size-for-speed trade is well worth it.
CONFIG_SPEED_OPTIMIZATIONS=y

# Crash diagnostics.
CONFIG_THREAD_NAME=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_THREAD_RUNTIME_STATS=y
# Hardware watchdog, fed from a high-priority thread in resetinfo.c.
# A wedge that kills interrupts (fault-in-fault lockup, corrupted
# kernel) starves the feeder and the chip self-resets instead of
# hanging until a physical replug; chip_reset then shows WATCHDOG.
CONFIG_WATCHDOG=y

# Pin the shell to a higher-urgency priority than the emulator's runner so
# `quit`, `pause`, `stats` etc. always preempt the per-frame loop.
CONFIG_SHELL_THREAD_PRIORITY_OVERRIDE=y
CONFIG_SHELL_THREAD_PRIORITY=4

# Round-robin among same-priority preempt threads.
CONFIG_TIMESLICING=y
CONFIG_TIMESLICE_SIZE=10
CONFIG_TIMESLICE_PRIORITY=0
