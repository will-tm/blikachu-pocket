# BL618 production overrides: complete game/UI stack, USB CDC +
# DFU, and WiFi/WebUI. UART0 is log output only.



# No fixed-regulator node on this board (power latch is GPIO-driven).
CONFIG_REGULATOR=n
CONFIG_REGULATOR_FIXED=n


# Tickless operation with 10 us ticks keeps 16.743 ms frame pacing accurate.
CONFIG_SYS_CLOCK_TICKS_PER_SEC=100000

# Gambatte uses the C++ library; allocation failures must reach the frontend.
CONFIG_CPP=y
CONFIG_REQUIRES_FULL_LIBCPP=y
CONFIG_STD_CPP17=y
CONFIG_CPP_EXCEPTIONS=y
CONFIG_CPP_RTTI=n
CONFIG_SYS_HEAP_RUNTIME_STATS=y

# `reboot` shell command (sys_reboot).
CONFIG_REBOOT=y

# Bring-up helpers: poke pins / ADC / PWM / buttons from the shell.
CONFIG_GPIO_SHELL=y
CONFIG_ADC_SHELL=y
CONFIG_PWM_SHELL=y
CONFIG_INPUT_SHELL=y
CONFIG_INPUT_EVENT_DUMP=y

# --- WiFi (BL61x full-MAC blob + hostap) ---
CONFIG_WIFI=y
# Upstream driver symbol (was BFLB_WIFI before the driver merged into
# drivers/wifi/bflb; auto-selects the wpa_supplicant + WL80211 shim).
CONFIG_WIFI_BFLB=y
CONFIG_NETWORKING=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_NET_L2_WIFI_SHELL=y
CONFIG_WPA_CLI=y
CONFIG_NET_IPV4=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_UDP=y
CONFIG_NET_TCP=y
CONFIG_NET_SHELL=y
CONFIG_NET_LOG=y
CONFIG_DNS_RESOLVER=y
CONFIG_LOG_BUFFER_SIZE=1024
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=32
CONFIG_NET_MGMT_EVENT_QUEUE_TIMEOUT=100
# Keep the kernel and driver heap in SRAM; hostap scan results and other
# supplicant allocations use a separate PSRAM heap.
CONFIG_WIFI_NM_WPA_SUPPLICANT_GLOBAL_HEAP=n
CONFIG_WIFI_NM_WPA_SUPPLICANT_HEAP=49152
CONFIG_HEAP_MEM_POOL_SIZE=36864


# --- WebUI (Zephyr native http_server) ---
CONFIG_HTTP_SERVER=y
# libc malloc arena: default -1 grabs "all leftover RAM" which is a
# couple of KB here — first malloc aborts (found via the raw fatal
# dump: pc=malloc_prepare). Fixed size, relocated to PSRAM in CMake.
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=65536
CONFIG_HTTP_SERVER_RESOURCE_WILDCARD=y

# HTTP/TCP throughput tuning (from Will's speed_test project):
# full-frame net bufs + big TCP windows; pools live in PSRAM.
CONFIG_HTTP_SERVER_CLIENT_BUFFER_SIZE=1280
CONFIG_HTTP_SERVER_CLIENT_INACTIVITY_TIMEOUT=10
CONFIG_NET_TCP_RECV_QUEUE_TIMEOUT=300
CONFIG_NET_TCP_INIT_RETRANSMISSION_TIMEOUT=100
CONFIG_HTTP_SERVER_MAX_CLIENTS=3
# HTTP/1.1 only (meme_portal-proven); smaller server stack.
CONFIG_HTTP_SERVER_VERSION_1=y
CONFIG_HTTP_SERVER_VERSION_2=n
# RX processing must not run cooperative: a coop TC thread hogging
# the CPU during a big upload starves every preemptible thread (wdt
# feeder, USB, shell) — exactly the observed wedge signature.
CONFIG_NET_TC_THREAD_PREEMPTIVE=y
# fs/settings/PBKDF2 paths need the full 8K shell stack ;
# 6144 overflowed silently (no PSPLIM on riscv) once layout shifted —
# crashed every deep flash write. Paid for by halving HTTP buffers.
CONFIG_SHELL_STACK_SIZE=8192
CONFIG_HTTP_SERVER_WEBSOCKET=y
CONFIG_WEBSOCKET_CLIENT=y
# Aborted uploads hold TCP contexts until timeout; default 6 runs out.
CONFIG_NET_MAX_CONTEXTS=8
# bflb PWM shares ONE period across channels: every buzzer note
# retunes it and the driver logs at INFO — silence until the backlight
# moves to a hardware-timer soft-PWM (planned).
CONFIG_PWM_LOG_LEVEL_WRN=y
CONFIG_COUNTER=y

# --- USB DFU firmware update (src/bl618/usb_dfu.c) ---
# dfu-util -d 2e8a:000a -D build/zephyr/zephyr.dfu.bin
CONFIG_USBD_DFU=y
CONFIG_USBD_DFU_TRANSFER_SIZE=1024
CONFIG_USBD_DFU_ENABLE_UPLOAD=n
# Not manifestation tolerant: the device installs and resets after the
# download instead of returning to dfuIDLE.
CONFIG_USBD_DFU_MANIFESTATION_TOLERANT=n
CONFIG_USBD_DFU_LOG_LEVEL_WRN=y
# Image check (SHA-256 against the BFNP header).
CONFIG_PSA_CRYPTO=y
CONFIG_PSA_WANT_ALG_SHA_256=y

# Keep CDC traffic from generating a log entry for every transmitted chunk.
CONFIG_USBD_CDC_ACM_LOG_LEVEL_WRN=y

# Installer error paths must not call XIP-resident logging after erase.
CONFIG_FLASH_LOG_LEVEL_OFF=y

CONFIG_FILE_SYSTEM_SHELL_MOUNT_COMMAND=n
